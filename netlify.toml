# Static dashboard, no build step. Netlify serves everything in site/.
[build]
  publish = "site"

# Long cache for the immutable stuff, none for the page itself, so a push
# shows up immediately rather than after a cache expiry.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The period page and its data files change with every update, so they are
# never served stale either.
[[headers]]
  for = "/periods.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

# The methods page reads the same index file, so it follows the same rule.
[[headers]]
  for = "/methods.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
